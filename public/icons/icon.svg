<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="256" y1="60" x2="256" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="0" y="8" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Apple Continuous Corner Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle specular highlight -->
  <rect x="34" y="34" width="444" height="220" rx="98" fill="url(#glowGrad)" />

  <!-- Radar Concentric Wave Rings -->
  <circle cx="256" cy="256" r="160" stroke="white" stroke-opacity="0.18" stroke-width="6" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="115" stroke="white" stroke-opacity="0.25" stroke-width="5" />
  <circle cx="256" cy="256" r="70" stroke="white" stroke-opacity="0.35" stroke-width="4" />

  <!-- Central NearDrop Arrow / Parachute Symbol -->
  <g transform="translate(256, 256)">
    <!-- Central Droplet / Ping -->
    <circle cx="0" cy="0" r="28" fill="white" />
    <path d="M-40 -40 L40 -40 L0 -90 Z" fill="white" opacity="0.9" />
    
    <!-- Beam down -->
    <path d="M-8 0 L8 0 L8 50 L-8 50 Z" fill="white" opacity="0.9" />
    <!-- Down chevron arrow -->
    <path d="M-28 40 L0 75 L28 40" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
